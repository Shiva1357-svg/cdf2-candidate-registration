spring.application.name=cdf2
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/cdf2db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false

# Administrator assigns this ID before sharing the candidate form invitation.
# Change this value for each candidate invitation.
cdf2.admin-assigned-candidate-id=CDF2-2026-0001
