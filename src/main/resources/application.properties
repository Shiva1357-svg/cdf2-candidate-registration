spring.application.name=cdf2
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cdf2db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=true

# Change these environment variables before exposing the application publicly.
cdf2.recruiter.username=${CDF2_RECRUITER_USERNAME:recruiter}
cdf2.recruiter.password=${CDF2_RECRUITER_PASSWORD:recruiter1}

# Optional SMTP settings. If no SMTP host is configured, recruiter can copy and share the link.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
cdf2.mail.from=${MAIL_FROM:noreply@example.com}
